<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vinteo Import</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      width: 320px;
      padding: 20px;
      background: #1a1a2e;
      color: #e0e0e0;
      margin: 0;
    }
    h1 {
      font-size: 18px;
      color: #7289da;
      margin: 0 0 20px 0;
      text-align: center;
    }
    .section {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 13px;
      margin-bottom: 6px;
      color: #b0b0b0;
    }
    input[type="text"] {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #3a3a5c;
      border-radius: 6px;
      background: #2a2a4a;
      color: #e0e0e0;
      font-size: 14px;
      box-sizing: border-box;
    }
    input[type="text"]:focus {
      outline: none;
      border-color: #7289da;
    }
    button {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      margin-top: 6px;
    }
    #btn-send-code {
      background: #5865f2;
      color: white;
    }
    #btn-send-code:hover { background: #4752c4; }
    #btn-verify {
      background: #57f287;
      color: #1a1a2e;
      font-weight: bold;
    }
    #btn-verify:hover { background: #3bc96e; }
    #btn-logout {
      background: #ed4245;
      color: white;
    }
    #btn-logout:hover { background: #c03537; }
    .status {
      margin-top: 12px;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 13px;
      display: none;
    }
    .status.success { background: #1e3a2e; color: #57f287; display: block; }
    .status.error   { background: #3a1e1e; color: #ed4245; display: block; }
    .status.info    { background: #1e2a3a; color: #7289da; display: block; }
    #auth-screen, #logged-screen { display: none; }
    #logged-screen .user-info {
      text-align: center;
      padding: 10px;
      background: #2a2a4a;
      border-radius: 8px;
      margin-bottom: 16px;
    }
    #logged-screen .user-info .name {
      font-size: 16px;
      font-weight: bold;
      color: #7289da;
    }
    #logged-screen .user-info .label {
      font-size: 12px;
      color: #808080;
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <h1>🎬 Vinteo Import</h1>

  <!-- Écran de connexion -->
  <div id="auth-screen">
    <div class="section">
      <label for="discord-id">Discord ID</label>
      <input type="text" id="discord-id" placeholder="Ex: 123456789012345678">
      <button id="btn-send-code">📨 Envoyer le code</button>
    </div>

    <div class="section" id="verify-section" style="display:none;">
      <label for="verify-code">Code de vérification (reçu en DM)</label>
      <input type="text" id="verify-code" placeholder="Ex: 482914" maxlength="6">
      <button id="btn-verify">✅ Vérifier et se connecter</button>
    </div>

    <div id="auth-status" class="status"></div>
  </div>

  <!-- Écran connecté -->
  <div id="logged-screen">
    <div class="user-info">
      <div class="label">Connecté en tant que</div>
      <div class="name" id="user-name"></div>
    </div>
    <button id="btn-logout">🚪 Se déconnecter</button>
    <div id="logout-status" class="status"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
